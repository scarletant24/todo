<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f4f9; display: flex; justify-content: center; padding: 40px 16px; }
    .container { background: #ffffff; padding: 24px; border-radius: 8px; width: 100%; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { font-size: 1.5rem; margin-bottom: 16px; color: #333; }
    
    .input-group { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button { padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; background-color: #007bff; color: white; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 0.9rem; }
    select { padding: 6px; border-radius: 4px; border: 1px solid #ccc; }

    ul { list-style: none; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; gap: 8px; }
    li.completed .todo-text { text-decoration: line-through; color: #888888; }
    
    .todo-content { display: flex; align-items: center; gap: 10px; flex: 1; }
    .todo-text { font-size: 1rem; word-break: break-all; }
    
    .actions { display: flex; gap: 4px; }
    .btn-edit { background-color: #ffc107; color: #333; }
    .btn-edit:hover { background-color: #e0a800; }
    .btn-delete { background-color: #dc3545; }
    .btn-delete:hover { background-color: #c82333; }
  </style>
</head>
<body>

  <div class="container">
    <h1>My Todo List</h1>
    
    <form class="input-group" id="todo-form">
      <input type="text" id="todo-input" placeholder="Add a new task..." required>
      <button type="submit">Add</button>
    </form>

    <div class="controls">
      <label for="sort-select">Sort by:</label>
      <select id="sort-select">
        <option value="all">All</option>
        <option value="incomplete">Incomplete First</option>
        <option value="completed">Completed First</option>
      </select>
    </div>

    <ul id="todo-list"></ul>
  </div>

  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const todoList = document.getElementById('todo-list');
    const sortSelect = document.getElementById('sort-select');

    let todos = JSON.parse(localStorage.getItem('todos')) || [];

    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function renderTodos() {
      todoList.innerHTML = '';
      
      let sortedTodos = [...todos];
      const filter = sortSelect.value;
      if (filter === 'incomplete') {
        sortedTodos.sort((a, b) => a.completed - b.completed);
      } else if (filter === 'completed') {
        sortedTodos.sort((a, b) => b.completed - a.completed);
      }

      sortedTodos.forEach((todo) => {
        const li = document.createElement('li');
        if (todo.completed) li.classList.add('completed');

        const contentDiv = document.createElement('div');
        contentDiv.className = 'todo-content';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.addEventListener('change', () => toggleTodo(todo.id));

        const span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = todo.text;

        contentDiv.appendChild(checkbox);
        contentDiv.appendChild(span);

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'actions';

        const editBtn = document.createElement('button');
        editBtn.textContent = 'Edit';
        editBtn.className = 'btn-edit';
        editBtn.addEventListener('click', () => editTodo(todo.id));

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.className = 'btn-delete';
        deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

        actionsDiv.appendChild(editBtn);
        actionsDiv.appendChild(deleteBtn);

        li.appendChild(contentDiv);
        li.appendChild(actionsDiv);
        todoList.appendChild(li);
      });
    }

    function addTodo(text) {
      const newTodo = { id: Date.now(), text, completed: false };
      todos.push(newTodo);
      saveTodos();
      renderTodos();
    }

    function toggleTodo(id) {
      todos = todos.map(todo => todo.id === id ? { ...todo, completed: !todo.completed } : todo);
      saveTodos();
      renderTodos();
    }

    function editTodo(id) {
      const todo = todos.find(t => t.id === id);
      const updatedText = prompt('Update task:', todo.text);
      if (updatedText !== null && updatedText.trim() !== '') {
        todo.text = updatedText.trim();
        saveTodos();
        renderTodos();
      }
    }

    function deleteTodo(id) {
      todos = todos.filter(todo => todo.id !== id);
      saveTodos();
      renderTodos();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (text) {
        addTodo(text);
        input.value = '';
      }
    });

    sortSelect.addEventListener('change', renderTodos);

    renderTodos();
  </script>
</body>
</html>
