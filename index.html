<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Todo List</title>
  <style>
    :root {
      --bg-color: #f4f4f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --subtext-color: #888888;
      --border-color: #e0e0e0;
      --primary-color: #007bff;
      --primary-hover: #0056b3;
      --danger-color: #dc3545;
      --warning-color: #ffc107;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --bg-color: #18181b;
      --card-bg: #27272a;
      --text-color: #f4f4f5;
      --subtext-color: #a1a1aa;
      --border-color: #3f3f46;
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --shadow: rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; transition: background-color 0.2s, color 0.2s; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; padding: 40px 16px; }
    
    .container { background: var(--card-bg); padding: 24px; border-radius: 12px; width: 100%; max-width: 650px; box-shadow: 0 10px 15px -3px var(--shadow); }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .theme-toggle { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 12px; border-radius: 20px; cursor: pointer; }

    /* Form Styles */
    .todo-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .form-row { display: flex; gap: 8px; flex-wrap: wrap; }
    input, select, button { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--card-bg); color: var(--text-color); font-size: 0.95rem; }
    input[type="text"] { flex: 1; min-width: 200px; }
    .btn-primary { background: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: bold; }
    .btn-primary:hover { background: var(--primary-hover); }

    /* Controls & Filtering */
    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
    .tag-manager-link { color: var(--primary-color); cursor: pointer; text-decoration: underline; font-size: 0.85rem; }

    /* Todo List Styling */
    ul { list-style: none; }
    .todo-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 8px; background: var(--card-bg); opacity: 1; transform: translateY(0); transition: all 0.3s ease; cursor: grab; }
    .todo-item:active { cursor: grabbing; }
    .todo-item.dragging { opacity: 0.4; border: 2px dashed var(--primary-color); }
    .todo-item.deleting { opacity: 0; transform: translateX(30px); }

    .todo-content { display: flex; align-items: center; gap: 12px; flex: 1; }
    .todo-item.completed .todo-text { text-decoration: line-through; color: var(--subtext-color); }

    /* Custom Checkbox Toggle */
    .checkbox-container { position: relative; width: 20px; height: 20px; cursor: pointer; }
    .checkbox-container input { opacity: 0; width: 0; height: 0; }
    .checkmark { position: absolute; top: 0; left: 0; height: 20px; width: 20px; background-color: transparent; border: 2px solid var(--subtext-color); border-radius: 4px; transition: all 0.2s; }
    .checkbox-container input:checked ~ .checkmark { background-color: var(--primary-color); border-color: var(--primary-color); }
    .checkmark:after { content: ""; position: absolute; display: none; left: 6px; top: 2px; width: 5px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .checkbox-container input:checked ~ .checkmark:after { display: block; }

    /* Badges & Meta Info */
    .todo-details { display: flex; flex-direction: column; gap: 4px; }
    .meta-tags { display: flex; gap: 6px; font-size: 0.75rem; align-items: center; }
    .badge { padding: 2px 6px; border-radius: 4px; font-weight: 600; font-size: 0.7rem; }
    .p-High { background: rgba(220, 53, 69, 0.2); color: #dc3545; }
    .p-Medium { background: rgba(255, 193, 7, 0.2); color: #d99b00; }
    .p-Low { background: rgba(40, 167, 69, 0.2); color: #28a745; }
    .tag-badge { background: var(--border-color); color: var(--text-color); }

    .actions { display: flex; gap: 6px; }
    .btn-action { padding: 6px 10px; font-size: 0.8rem; cursor: pointer; border: none; border-radius: 4px; }
    .btn-edit { background-color: var(--warning-color); color: #000; }
    .btn-delete { background-color: var(--danger-color); color: white; }

    /* Empty State */
    .empty-state { text-align: center; padding: 20px; color: var(--subtext-color); }
    .empty-state img { width: 150px; border-radius: 50%; margin-bottom: 10px; }

    /* Modal for Tag Management */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: var(--card-bg); padding: 20px; border-radius: 8px; max-width: 400px; width: 100%; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Pro Todo List</h1>
      <button class="theme-toggle" id="theme-btn">🌙 Dark Mode</button>
    </div>

    <form class="todo-form" id="todo-form">
      <div class="form-row">
        <input type="text" id="todo-input" placeholder="What needs to be done?" required>
      </div>
      <div class="form-row">
        <input type="date" id="todo-date">
        <select id="todo-priority">
          <option value="Low">Priority: Low</option>
          <option value="Medium" selected>Priority: Medium</option>
          <option value="High">Priority: High</option>
        </select>
        <select id="todo-tag"></select>
        <button type="submit" class="btn-primary">Add Task</button>
      </div>
    </form>

    <div class="controls">
      <div>
        <select id="filter-tag"><option value="all">All Tags</option></select>
        <select id="sort-select">
          <option value="default">Sort Manual / Newest</option>
          <option value="urgency">Sort by Priority/Urgency</option>
          <option value="date">Sort by Due Date</option>
          <option value="completion">Incomplete First</option>
        </select>
      </div>
      <span class="tag-manager-link" id="manage-tags-btn">Manage Tags</span>
    </div>

    <ul id="todo-list"></ul>

    <div id="empty-state" class="empty-state" style="display: none;">
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3dvaGs5OTNkdTF1NWtzNWlyazN4MDFsbzBjdTVoYWJrbDFmeG4xeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/mCRJDo24UvJMA/giphy.gif" alt="Dog digging for bones">
      <p>All caught up! No tasks found.</p>
    </div>
  </div>

  <div class="modal" id="tag-modal">
    <div class="modal-content">
      <h3>Manage Tags</h3>
      <br>
      <div class="form-row">
        <input type="text" id="new-tag-input" placeholder="New tag name...">
        <button id="add-tag-btn" class="btn-primary">Add</button>
      </div>
      <br>
      <ul id="tag-list-display"></ul>
      <div class="modal-actions">
        <button class="btn-action" id="close-modal-btn">Close</button>
      </div>
    </div>
  </div>

  <script>
    // State Initialization
    let todos = JSON.parse(localStorage.getItem('todos_v2')) || [];
    let tags = JSON.parse(localStorage.getItem('tags_v2')) || ['Personal', 'Work', 'General'];

    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const todoDate = document.getElementById('todo-date');
    const todoPriority = document.getElementById('todo-priority');
    const todoTagSelect = document.getElementById('todo-tag');
    const filterTagSelect = document.getElementById('filter-tag');
    const sortSelect = document.getElementById('sort-select');
    const todoList = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');
    const themeBtn = document.getElementById('theme-btn');

    // Tag Modal Elements
    const tagModal = document.getElementById('tag-modal');
    const manageTagsBtn = document.getElementById('manage-tags-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const addTagBtn = document.getElementById('add-tag-btn');
    const newTagInput = document.getElementById('new-tag-input');
    const tagListDisplay = document.getElementById('tag-list-display');

    // Theme Logic
    const currentTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);
    themeBtn.textContent = currentTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';

    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      themeBtn.textContent = newTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    });

    // Save & Sync Data
    function saveData() {
      localStorage.setItem('todos_v2', JSON.stringify(todos));
      localStorage.setItem('tags_v2', JSON.stringify(tags));
    }

    function populateTagDropdowns() {
      todoTagSelect.innerHTML = '';
      filterTagSelect.innerHTML = '<option value="all">All Tags</option>';
      tags.forEach(tag => {
        todoTagSelect.innerHTML += `<option value="${tag}">${tag}</option>`;
        filterTagSelect.innerHTML += `<option value="${tag}">${tag}</option>`;
      });
    }

    // Render Functionality
    function render() {
      populateTagDropdowns();
      todoList.innerHTML = '';

      let filtered = todos.filter(t => filterTagSelect.value === 'all' || t.tag === filterTagSelect.value);

      // Sorting Logic
      const sortMode = sortSelect.value;
      if (sortMode === 'urgency') {
        const pRank = { High: 3, Medium: 2, Low: 1 };
        filtered.sort((a, b) => pRank[b.priority] - pRank[a.priority]);
      } else if (sortMode === 'date') {
        filtered.sort((a, b) => new Date(a.dueDate || '9999-12-31') - new Date(b.dueDate || '9999-12-31'));
      } else if (sortMode === 'completion') {
        filtered.sort((a, b) => a.completed - b.completed);
      }

      emptyState.style.display = filtered.length === 0 ? 'block' : 'none';

      filtered.forEach(todo => {
        const li = document.createElement('li');
        li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
        li.draggable = sortMode === 'default'; // Only enable dragging when not explicitly sorted
        li.dataset.id = todo.id;

        li.innerHTML = `
          <div class="todo-content">
            <label class="checkbox-container">
              <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${todo.id})">
              <span class="checkmark"></span>
            </label>
            <div class="todo-details">
              <span class="todo-text">${escapeHtml(todo.text)}</span>
              <div class="meta-tags">
                <span class="badge p-${todo.priority}">${todo.priority}</span>
                <span class="badge tag-badge">${todo.tag}</span>
                ${todo.dueDate ? `<span>📅 ${todo.dueDate}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="actions">
            <button class="btn-action btn-edit" onclick="editTodo(${todo.id})">Edit</button>
            <button class="btn-action btn-delete" onclick="deleteTodo(${todo.id}, this)">Delete</button>
          </div>
        `;

        setupDragAndDrop(li);
        todoList.appendChild(li);
      });
    }

    // Helper Utility
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Actions
    todoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;

      todos.unshift({
        id: Date.now(),
        text,
        dueDate: todoDate.value,
        priority: todoPriority.value,
        tag: todoTagSelect.value,
        completed: false
      });

      todoInput.value = '';
      todoDate.value = '';
      saveData();
      render();
    });

    window.toggleTodo = function(id) {
      todos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveData();
      render();
    };

    window.editTodo = function(id) {
      const todo = todos.find(t => t.id === id);
      const updatedText = prompt('Update task name:', todo.text);
      if (updatedText !== null && updatedText.trim() !== '') {
        todo.text = updatedText.trim();
        saveData();
        render();
      }
    };

    window.deleteTodo = function(id, btnElement) {
      const li = btnElement.closest('.todo-item');
      li.classList.add('deleting');
      setTimeout(() => {
        todos = todos.filter(t => t.id !== id);
        saveData();
        render();
      }, 300); // Waits for transition CSS to complete
    };

    // Drag and Drop Logic
    let draggedItem = null;

    function setupDragAndDrop(item) {
      item.addEventListener('dragstart', (e) => {
        draggedItem = item;
        setTimeout(() => item.classList.add('dragging'), 0);
      });

      item.addEventListener('dragend', () => {
        draggedItem.classList.remove('dragging');
        draggedItem = null;
        reorderTodosFromDOM();
      });

      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        const afterElement = getDragAfterElement(todoList, e.clientY);
        if (afterElement == null) {
          todoList.appendChild(draggedItem);
        } else {
          todoList.insertBefore(draggedItem, afterElement);
        }
      });
    }

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.todo-item:not(.dragging)')];
      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function reorderTodosFromDOM() {
      const reorderedIds = [...todoList.querySelectorAll('.todo-item')].map(el => Number(el.dataset.id));
      todos.sort((a, b) => reorderedIds.indexOf(a.id) - reorderedIds.indexOf(b.id));
      saveData();
    }

    // Tag Management Modal Logic
    manageTagsBtn.addEventListener('click', () => {
      renderTagModalList();
      tagModal.style.display = 'flex';
    });

    closeModalBtn.addEventListener('click', () => tagModal.style.display = 'none');

    addTagBtn.addEventListener('click', () => {
      const name = newTagInput.value.trim();
      if (name && !tags.includes(name)) {
        tags.push(name);
        newTagInput.value = '';
        saveData();
        renderTagModalList();
        render();
      }
    });

    function renderTagModalList() {
      tagListDisplay.innerHTML = '';
      tags.forEach(tag => {
        const li = document.createElement('li');
        li.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;';
        li.innerHTML = `
          <span>${tag}</span>
          <button class="btn-action btn-delete" onclick="removeTag('${tag}')">Delete</button>
        `;
        tagListDisplay.appendChild(li);
      });
    }

    window.removeTag = function(tagToDelete) {
      if (tags.length <= 1) {
        alert("You must keep at least one tag available!");
        return;
      }

      const assignedTodos = todos.filter(t => t.tag === tagToDelete);

      if (assignedTodos.length > 0) {
        const alternateTags = tags.filter(t => t !== tagToDelete);
        const migrateTo = prompt(
          `The tag "${tagToDelete}" is assigned to ${assignedTodos.length} todo(s).\n\nProvide an alternate tag to migrate these items to:\nAvailable: ${alternateTags.join(', ')}`
        );

        if (!migrateTo || !alternateTags.includes(migrateTo.trim())) {
          alert('Migration cancelled or invalid target tag selected. Tag was not deleted.');
          return;
        }

        // Migrate todos to target tag
        todos = todos.map(t => t.tag === tagToDelete ? { ...t, tag: migrateTo.trim() } : t);
      }

      tags = tags.filter(t => t !== tagToDelete);
      saveData();
      renderTagModalList();
      render();
    };

    filterTagSelect.addEventListener('change', render);
    sortSelect.addEventListener('change', render);

    // Initial Launch
    render();
  </script>
</body>
</html>
